<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071b28" />
  <title>Equipalok | Catálogo de Equipamentos</title>
  <meta name="description" content="Catálogo Equipalok 2026 - equipamentos para locação em clínicas de estética." />
  <style>
    :root { color-scheme: light; --navy:#071b28; --lime:#a9df34; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#071b28; font-family:Arial,Helvetica,sans-serif; }
    body { min-height:100dvh; }
    .topbar {
      min-height:58px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--navy); color:#fff; border-bottom:1px solid rgba(255,255,255,.12);
    }
    .brand { display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
    .dot { width:14px; height:14px; border-radius:50%; background:var(--lime); flex:0 0 auto; }
    .actions { display:flex; gap:8px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:8px 12px; border-radius:9px; text-decoration:none; font-weight:800; font-size:13px; }
    .btn.primary { background:var(--lime); color:var(--navy); }
    .viewer { width:100%; height:calc(100dvh - 58px); background:#edf3f5; }
    iframe { display:block; width:100%; height:100%; border:0; background:#edf3f5; }
    .fallback { display:none; }
    @media (max-width:640px) {
      .topbar { min-height:54px; padding:8px 10px; }
      .brand { font-size:14px; }
      .btn { font-size:12px; padding:8px 10px; }
      .viewer { height:calc(100dvh - 54px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>EQUIPALOK</span></div>
    <div class="actions">
      <a class="btn primary" href="/catalogo-equipalok.pdf" target="_blank" rel="noopener">ABRIR CATÁLOGO</a>
    </div>
  </header>
  <main class="viewer">
    <iframe src="/catalogo-equipalok.pdf#view=FitH" title="Catálogo Equipalok 2026">
      <p class="fallback">Seu navegador não exibiu o PDF. <a href="/catalogo-equipalok.pdf">Abra o catálogo aqui.</a></p>
    </iframe>
  </main>
</body>
</html>
