name: Corrigir catalogo oficial

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_catalog.py'
      - '.github/workflows/fix-catalog.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyMuPDF
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7

      - name: Recuperar o PDF-base com fotos e layout original
        run: |
          git show 5efc6608db46768051d563ee7cf23ec0b49deeae:catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf > base-catalogo.pdf
          test $(stat -c%s base-catalogo.pdf) -gt 100000

      - name: Aplicar somente as correcoes de texto
        run: python scripts/fix_catalog.py

      - name: Configurar Vercel para exibir o proprio PDF
        run: |
          cat > vercel.json <<'JSON'
          {
            "rewrites": [
              {
                "source": "/",
                "destination": "/catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf"
              }
            ],
            "headers": [
              {
                "source": "/catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf",
                "headers": [
                  {
                    "key": "Content-Disposition",
                    "value": "inline; filename=catalogo-equipalok.pdf"
                  },
                  {
                    "key": "Cache-Control",
                    "value": "public, max-age=0, must-revalidate"
                  }
                ]
              }
            ]
          }
          JSON

      - name: Validar arquivo final
        run: |
          test $(stat -c%s catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf) -gt 100000
          python - <<'PY'
          import fitz
          p='catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf'
          d=fitz.open(p)
          assert d.page_count == 6
          assert sum(len(pg.get_images(full=True)) for pg in d) >= 3
          print('PDF OK:', d.page_count, 'paginas')
          PY

      - name: Publicar PDF oficial no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo-equipalok-locacao-whatsapp-FINAL-CTA-v2.pdf vercel.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria.'
          else
            git commit -m 'Restaura catalogo oficial com fotos e textos corrigidos'
            git push
          fi
